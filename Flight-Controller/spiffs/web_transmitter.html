<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .main-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .joystick-container {
      display: grid;
      grid-template-areas:
        "shoulder-left center shoulder-right"
        "dpad         empty  actions"
        "analog-left  empty  analog-right";
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: min-content min-content 1fr;
      align-items: center;
      justify-items: center;
      flex: 8 1 0%;
      min-height: 0;
      width: 100vw;
      height: 100%;
      gap: 10px;
    }
    .shoulder-right {
      grid-area: shoulder-right;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 8px; /* space between buttons */
    }
    .shoulder-left {
      grid-area: shoulder-left;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 8px; /* space between buttons */
    }
    .dpad {
      grid-area: dpad;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .actions {
      grid-area: actions;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .analog-left {
      grid-area: analog-left;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .analog-right {
      grid-area: analog-right;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .joystick-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .joystick-canvas {
      width: 120px;
      height: 120px;
      max-width: 30vw;
      max-height: 30vw;
      touch-action: none;
      background: #e0e0e0;
      border-radius: 50%;
      box-shadow: 0 2px 8px #0002;
      margin: 0 auto;
      display: block;
    }

    button {
      height: 60px;
      width: 60px;
      font-size: 18px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active {
      background-color: #0056b3;
    }
    .l2, .r2, .l1, .r1 { width: 120px; }

    .center {
      grid-area: center;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
    }
    .buttons {
      grid-area: buttons;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .up, .down, .left, .right, .triangle, .square, .circle, .x {
      width: 50px;
      height: 50px;
      font-size: 16px;
      margin: 2px;
    }

    .control-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex: 2 1 0%;
      min-height: 0;
    }
    select {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      height: 40px;
      min-width: 150px;
    }
    .text-input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      height: 40px;
      min-width: 200px;
      box-sizing: border-box;
    }
    .ok-button-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
    #confirmBtn {
      padding: 0 20px; 
      height: 40px; 
      background-color: #007bff; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #confirmBtn:active {
      background-color: #0056b3;
    }
    .nested-selects {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #subMenu {
      display: none;
    }
    #subMenu.visible {
      display: block;
    }
  </style>
  <script src="joy.js"></script>
  <script>
    // Button mapping using data attributes
    const buttonMap = {
      "cross": "cross",
      "square": "square",
      "triangle": "triangle",
      "circle": "circle",
      "up": "up",
      "down": "down",
      "left": "left",
      "right": "right",
      "r1": "r1",
      "l1": "l1",
      "r2": "r2",
      "l2": "l2",
      "start": "start",
      "reset": "reset"
    };

    // Button state tracker
    const buttonStates = {};

    // Event queue for button actions
    const eventQueue = [];
    let processing = false;

    async function processEventQueueSequential() {
      if (processing) return;
      processing = true;
      while (eventQueue.length > 0) {
        const event = eventQueue.shift();
        await sendButtonAction(event.button, event.action);
        await new Promise(resolve => setTimeout(resolve, 10)); // 10ms delay between events
      }
      processing = false;
    }

    function queueButtonEvent(button, action) {
      eventQueue.push({ button, action });
      processEventQueueSequential();
    }

    function sendButtonAction(button, action) {
      const mappedButton = buttonMap[button];
      if (!mappedButton) {
        console.error(`Unmapped button: ${button}`);
        return Promise.resolve();
      }
      return fetch(`/button`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ button: mappedButton, action }),
      }).catch((err) => {
        console.error("Error:", err);
      });
    }

    function handlePress(button) {
      if (!buttonStates[button]) {
        buttonStates[button] = true;
        queueButtonEvent(button, "press");
      }
    }

    function handleRelease(button) {
      if (buttonStates[button]) {
        buttonStates[button] = false;
        queueButtonEvent(button, "release");
      }
    }

    function attachButtonEvents(buttonElement) {
      const buttonKey = buttonElement.dataset.button;
      buttonElement.addEventListener("mousedown", () => handlePress(buttonKey));
      buttonElement.addEventListener("mouseup", () => handleRelease(buttonKey));
      buttonElement.addEventListener("mouseleave", () => handleRelease(buttonKey));
      buttonElement.addEventListener("touchstart", (e) => {
        e.preventDefault();
        handlePress(buttonKey);
      });
      buttonElement.addEventListener("touchend", () => handleRelease(buttonKey));
      buttonElement.addEventListener("touchcancel", () => handleRelease(buttonKey));
    }

    // Submenu options for each main menu value
    const submenuOptions = {
      roll: ["Kp", "Ki", "Kd"],
      roll_d: ["Kp", "Ki", "Kd"],
      pitch: ["Kp", "Ki", "Kd"],
      pitch_d: ["Kp", "Ki", "Kd"],
      yaw: ["Kp", "Ki", "Kd"],
      yaw_d: ["Kp", "Ki", "Kd"]
    };

    document.addEventListener("DOMContentLoaded", () => {
      // Attach events to joystick buttons
      document.querySelectorAll(".joystick-container button").forEach(attachButtonEvents);

      // Submenu logic
      const mainSelect = document.getElementById('mainMenu');
      const subMenu = document.getElementById('subMenu');

      mainSelect.addEventListener('change', function() {
        const options = submenuOptions[this.value];
        if (options) {
          subMenu.innerHTML = options.map(opt => `<option value="${opt.toLowerCase()}">${opt}</option>`).join('');
          subMenu.classList.add('visible');
        } else {
          subMenu.classList.remove('visible');
          subMenu.innerHTML = '';
        }
      });

      // OK Button functionality
      document.getElementById('confirmBtn').addEventListener('click', function() {
        const mainOption = mainSelect.value;
        let selectedOption = mainOption;
        let selectedText = document.getElementById('textInput').value;

        if (submenuOptions[mainOption] && subMenu.classList.contains('visible')) {
          selectedOption = `${mainOption}_${subMenu.value}`;
        }

        fetch('/test_button', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: "selection",
            selected: selectedOption,
            text: selectedText
          }),
        })
        .then(response => response.json())
        .then(data => console.log('Response:', data))
        .catch(error => console.error('Error:', error));
      });

      // Add joysticks
      const leftZone = document.getElementById('left-joystick-zone');
      const rightZone = document.getElementById('right-joystick-zone');
      leftZone.style.height = rightZone.style.height = '100%';
      leftZone.style.width = rightZone.style.width = '100%';

      // Throttle sending joystick data
      function createJoystickSender(side) {
        let lastSent = { x: null, y: null };
        let lastSendTime = 0;
        let pending = null;
        let isPressed = false;
        const interval = 50; // ms, adjust as needed
        // Track pointer events for each joystick zone
        const zoneId = side === 'left' ? 'left-joystick-zone' : 'right-joystick-zone';
        const zone = document.getElementById(zoneId);
        zone.addEventListener('pointerdown', () => { isPressed = true; });
        zone.addEventListener('pointerup', () => { isPressed = false; });
        zone.addEventListener('pointercancel', () => { isPressed = false; });
        function send(data) {
          fetch('/joystick', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ side, hor: Math.round(data.x), ver: Math.round(data.y) })
          }).catch(err => console.error(`${side} joystick error:`, err));
          lastSent = { x: data.x, y: data.y };
          lastSendTime = Date.now();
        }
        return function(stickData) {
          // Only send if this stick is being interacted with, or if returning to zero
          const now = Date.now();
          const isZero = stickData.x == 0 && stickData.y == 0;
          // Always send return-to-zero if the last sent was not zero
          if (isZero && (lastSent.x != 0 || lastSent.y != 0)) {
            send(stickData);
            if (pending) { clearTimeout(pending); pending = null; }
            return;
          }
          if (!isPressed) return;
          // Throttle other updates
          if (now - lastSendTime > interval) {
            send(stickData);
            if (pending) { clearTimeout(pending); pending = null; }
          } else {
            if (pending) clearTimeout(pending);
            pending = setTimeout(() => {
              send(stickData);
              pending = null;
            }, interval - (now - lastSendTime));
          }
        };
      }
      // Left joystick
      const leftJoy = new JoyStick('left-joystick-zone', {
        title: 'left-joystick',
        width: 200,
        height: 200,
        internalFillColor: '#007bff',
        internalStrokeColor: '#003366',
        externalStrokeColor: '#007bff',
        autoReturnToCenter: true
      }, createJoystickSender('left'));
      // Right joystick
      const rightJoy = new JoyStick('right-joystick-zone', {
        title: 'right-joystick',
        width: 200,
        height: 200,
        internalFillColor: '#28a745',
        internalStrokeColor: '#155724',
        externalStrokeColor: '#28a745',
        autoReturnToCenter: true
      }, createJoystickSender('right'));
    });

    // Prevent double-tap zoom and two-finger pinch zoom
    document.addEventListener('touchstart', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</head>

<body>
    <div class="main-wrapper">
      <div class="joystick-container">
        <!-- Shoulder Buttons Row: L2, L1, center, R1, R2 -->
        <div class="shoulder-left">
          <button class="l2" data-button="l2">L2</button>
          <button class="l1" data-button="l1">L1</button>
        </div>
        <div class="center">
          <button data-button="start">START</button>
          <button data-button="reset">RESET</button>
        </div>
        <div class="shoulder-right">
          <button class="r2" data-button="r2">R2</button>
          <button class="r1" data-button="r1">R1</button>
        </div>
        <div class="dpad">
          <button class="up" data-button="up">↑</button>
          <button class="down" data-button="down">↓</button>
          <button class="left" data-button="left">←</button>
          <button class="right" data-button="right">→</button>
        </div>
        <div class="actions">
          <button class="triangle" data-button="triangle">▲</button>
          <button class="square" data-button="square">■</button>
          <button class="circle" data-button="circle">●</button>
          <button class="x" data-button="cross">x</button>
        </div>
        <div class="analog-left">
          <div class="joystick-zone" id="left-joystick-zone">
            <!-- Left joystick will be rendered here -->
          </div>
        </div>
        <div class="analog-right">
          <div class="joystick-zone" id="right-joystick-zone">
            <!-- Right joystick will be rendered here -->
          </div>
        </div>
      </div>
      <div class="control-container">
        <div class="nested-selects">
          <select id="mainMenu">
            <option value=""></option>
            <option value="z">z</option>
            <option value="roll">Roll</option>
            <option value="roll_d">Roll_d</option>
            <option value="pitch">Pitch</option>
            <option value="pitch_d">Pitch_d</option>
            <option value="yaw">Yaw</option>
            <option value="yaw_d">Yaw_d</option>
            <option value="simpleOption">Opción simple</option>
          </select>
          <select id="subMenu"></select>
        </div>
        <input type="text" id="textInput" class="text-input" placeholder="Ingrese texto aquí">
        <button id="confirmBtn">OK</button>
      </div>
    </div>
  </body>
</html>
