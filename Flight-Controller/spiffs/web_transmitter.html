<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .joystick-container {
      display: grid;
      grid-template-areas:
        "l2 . r2"
        "l1 . r1"
        "dpad center actions";
      grid-template-columns: 1fr auto 1fr;
      grid-gap: 20px;
    }

    button {
      height: 60px;
      width: 60px;
      font-size: 18px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:active {
      background-color: #0056b3;
    }

    /* Shoulder Buttons */
    .l2, .r2, .l1, .r1 {
      width: 120px;
    }

    .l2 { grid-area: l2; }
    .r2 { grid-area: r2; }
    .l1 { grid-area: l1; }
    .r1 { grid-area: r1; }

    /* D-Pad */
    .dpad {
      grid-area: dpad;
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .up { grid-area: up; }
    .down { grid-area: down; }
    .left { grid-area: left; }
    .right { grid-area: right; }

    /* Action Buttons */
    .actions {
      grid-area: actions;
      display: grid;
      grid-template-areas:
        ". triangle ."
        "square . circle"
        ". x .";
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .triangle { grid-area: triangle; }
    .square { grid-area: square; }
    .circle { grid-area: circle; }
    .x { grid-area: x; }

    /* Center Buttons */
    .center {
      grid-area: center;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
    }

    .control-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      height: 40px;
      min-width: 150px;
    }

    .text-input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      height: 40px;
      min-width: 200px;
      box-sizing: border-box;
    }

    .ok-button-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    #confirmBtn {
      padding: 0 20px; 
      height: 40px; 
      background-color: #007bff; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #confirmBtn:active {
      background-color: #0056b3;
    }

    .nested-selects {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sub-select {
      display: none;
    }
    .sub-select.visible {
      display: block;
    }
  </style>
  <script>
    // Dictionary to map button symbols/names to correct values
    const buttonMap = {
      "x": "cross",
      "■": "square",     // Square symbol
      "▲": "triangle",   // Triangle symbol
      "●": "circle",     // Circle symbol
      "↑": "up",         // Up arrow
      "↓": "down",       // Down arrow
      "←": "left",       // Left arrow
      "→": "right",      // Right arrow
      "r1": "r1",
      "l1": "l1",
      "r2": "r2",
      "l2": "l2",
      "start": "start",
      "reset": "reset"
    };

    // Button state tracker
    const buttonStates = {};

    function sendButtonAction(button, action) {
      const mappedButton = buttonMap[button]; // Use only mapped names, no fallback
      if (!mappedButton) {
        console.error(`Unmapped button: ${button}`);
        return; // Prevent sending unintended values
      }
      fetch(`/button`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ button: mappedButton, action }),
      }).catch((err) => console.error("Error:", err));
    }

    function handlePress(button) {
      if (!buttonStates[button]) {
        buttonStates[button] = true;
        sendButtonAction(button, "press");
      }
    }

    function handleRelease(button) {
      if (buttonStates[button]) {
        buttonStates[button] = false;
        sendButtonAction(button, "release");
      }
    }

    function attachButtonEvents(buttonElement, buttonText) {
      buttonElement.addEventListener("mousedown", () => handlePress(buttonText));
      buttonElement.addEventListener("mouseup", () => handleRelease(buttonText));
      buttonElement.addEventListener("mouseleave", () => handleRelease(buttonText));
      buttonElement.addEventListener("touchstart", (e) => {
        e.preventDefault(); // Prevent duplicate events on touch devices
        handlePress(buttonText);
      });
      buttonElement.addEventListener("touchend", () => handleRelease(buttonText));
      buttonElement.addEventListener("touchcancel", () => handleRelease(buttonText));
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Attach events to joystick buttons
      const buttons = document.querySelectorAll(".joystick-container button");
      buttons.forEach((button) => {
        const buttonText = button.textContent.trim();
        attachButtonEvents(button, buttonText);
      });

      // Configuración de selects anidados
      const mainSelect = document.getElementById('mainMenu');
      const subSelect1 = document.getElementById('subMenu1');
      const subSelect2 = document.getElementById('subMenu2');
      const subSelect3 = document.getElementById('subMenu3');
      const subSelect4 = document.getElementById('subMenu4');
      const subSelect5 = document.getElementById('subMenu5');
      const subSelect6 = document.getElementById('subMenu6');
      
      // Manejador de cambio para el select principal
      mainSelect.addEventListener('change', function() {
        // Oculta todos los submenús primero
        document.querySelectorAll('.sub-select').forEach(el => {
          el.classList.remove('visible');
        });
        
        // Muestra el submenú correspondiente
        if (this.value === 'roll') {
          subSelect1.classList.add('visible');
        } else if (this.value === 'roll_d') {
          subSelect2.classList.add('visible');
        } else if (this.value === 'pitch') {
          subSelect3.classList.add('visible');
        } else if (this.value === 'pitch_d') {
          subSelect4.classList.add('visible');
        } else if (this.value === 'yaw') {
          subSelect5.classList.add('visible');
        } else if (this.value === 'yaw_d') {
          subSelect6.classList.add('visible');
        }
      });

      // OK Button functionality modificada
      document.getElementById('confirmBtn').addEventListener('click', function() {
        const mainOption = mainSelect.value;
        let selectedOption = mainOption;
        let selectedText = document.getElementById('textInput').value;
        
        // Determina qué submenú está visible y obtiene su valor
        if (mainOption === 'roll' && subSelect1.classList.contains('visible')) {
          selectedOption = `roll_${subSelect1.value}`;
        } else if (mainOption === 'roll_d' && subSelect2.classList.contains('visible')) {
          selectedOption = `roll_d_${subSelect2.value}`;
        } else if (mainOption === 'pitch' && subSelect3.classList.contains('visible')) {
          selectedOption = `pitch_${subSelect3.value}`;
        } else if (mainOption === 'pitch_d' && subSelect4.classList.contains('visible')) {
          selectedOption = `pitch_d_${subSelect4.value}`;
        } else if (mainOption === 'yaw' && subSelect5.classList.contains('visible')) {
          selectedOption = `yaw_${subSelect5.value}`;
        } else if (mainOption === 'yaw_d' && subSelect6.classList.contains('visible')) {
          selectedOption = `yaw_d_${subSelect6.value}`;
        }
        
        console.log("Selected option:", selectedOption);
        console.log("User text:", selectedText);
        
        fetch('/test_button', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: "selection",
            selected: selectedOption,
            text: selectedText
          }),
        })
        .then(response => response.json())
        .then(data => console.log('Response:', data))
        .catch(error => console.error('Error:', error));
      });
    });
  </script>
</head>
<body>
  <div class="joystick-container">
    <!-- Shoulder Buttons -->
    <button class="l2">l2</button>
    <button class="r2">r2</button>
    <button class="l1">l1</button>
    <button class="r1">r1</button>

    <!-- D-Pad -->
    <div class="dpad">
      <button class="up">↑</button>
      <button class="down">↓</button>
      <button class="left">←</button>
      <button class="right">→</button>
    </div>

    <!-- Center Buttons -->
    <div class="center">
      <button>start</button>
      <button>reset</button>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="triangle">▲</button>
      <button class="square">■</button>
      <button class="circle">●</button>
      <button class="x">x</button>
    </div>
  </div>
  
  <div class="control-container">
    <div class="nested-selects">
      <select id="mainMenu">
        <option value=""></option>
        <option value="z">z</option>
        <option value="roll">Roll</option>
        <option value="roll_d">Roll_d</option>
        <option value="pitch">Pitch</option>
        <option value="pitch_d">Pitch_d</option>
        <option value="yaw">Yaw</option>
        <option value="yaw_d">Yaw_d</option>
        <option value="simpleOption">Opción simple</option>
      </select>
      
      <select id="subMenu1" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>
      
      <select id="subMenu2" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>

      <select id="subMenu3" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>

      <select id="subMenu4" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>
      
      <select id="subMenu5" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>

      <select id="subMenu6" class="sub-select">
        <option value="kp">Kp</option>
        <option value="ki">Ki</option>
        <option value="kd">Kd</option>
      </select>
    </div>
    
    <input type="text" id="textInput" class="text-input" placeholder="Ingrese texto aquí">
    <button id="confirmBtn">OK</button>
  </div>

</body>
</html>
